<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Panel{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="bg-dark text-white p-3" style="width: 200px; min-height: 100vh;">
            <h4>Admin ATS</h4>
            <ul class="nav flex-column mt-4">
                <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('main.dashboard') }}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('ofertas.listar_ofertas') }}">Ofertas laborales</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('auth.logout') }}">Cerrar sesión</a></li>
            </ul>
        </div>

        <!-- Main content -->
        <div class="p-4" style="flex-grow: 1;">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
